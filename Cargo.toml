[workspace]
resolver = "3"
members = ["crates/lightbaker", "crates/lightbaker-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jer-nc/lightbaker"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
pollster = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
zstd = "0.14"
flate2 = "1"

[profile.release]
debug = 1
